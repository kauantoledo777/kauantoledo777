<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#1f2d4d"/>
      <stop offset="1" stop-color="#2f81f7"/>
    </linearGradient>
    <style>
      .t{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:#fff;font-weight:700;font-size:54px;opacity:0;animation:in 1.2s ease-out .2s forwards}
      .s{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:#c9d7f2;font-size:19px;letter-spacing:1px;opacity:0;animation:in 1.2s ease-out .8s forwards}
      .c{font-family:Consolas,'Courier New',monospace;fill:#2f81f7;font-size:15px;opacity:.35}
      @keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
      .w1{animation:mv 8s ease-in-out infinite alternate}
      .w2{animation:mv 11s ease-in-out infinite alternate-reverse}
      @keyframes mv{from{transform:translateX(0)}to{transform:translateX(-60px)}}
    </style>
  </defs>
  <rect width="1000" height="230" fill="url(#bg)"/>
  <text x="40" y="45" class="c">&lt;/&gt; SELECT * FROM carreira WHERE foco = 'tecnologia';</text>
  <text x="620" y="205" class="c">int main(void) { aprender(); }</text>
  <path class="w1" d="M0 190 Q 125 160 250 190 T 500 190 T 750 190 T 1000 190 T 1250 190 V230 H0Z" fill="#0d1117" opacity=".35"/>
  <path class="w2" d="M0 205 Q 125 180 250 205 T 500 205 T 750 205 T 1000 205 T 1250 205 V230 H0Z" fill="#0d1117" opacity=".6"/>
  <text x="500" y="110" text-anchor="middle" class="t">Kauan Toledo</text>
  <text x="500" y="148" text-anchor="middle" class="s">SERVICE DESK  •  ADS  •  DESENVOLVIMENTO WEB &amp; BANCO DE DADOS</text>
</svg>
